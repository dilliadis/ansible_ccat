---
- hosts: all
  gather_facts: no
  tasks:
    - name: Create facts directory if it doesn't exist
      file:
        path: /etc/ansible/facts.d
        state: directory
        mode: '0755'
- hosts: ansible1
  gather_facts: no
  tasks:
    - name: Add custom facts to ansible1
      blockinfile:
        path: /etc/ansible/facts.d/local.fact
        create: true
        block: |
          [localfacts]
          type: production
- hosts: ansible2
  gather_facts: no
  tasks:
    - name: Add custom facts to ansible2
      blockinfile:
        path: /etc/ansible/facts.d/local.fact
        create: true
        block: |
          [localfacts]
          type: testing
- hosts: ansible3
  gather_facts: no
  tasks:
    - name: Add custom facts to ansible3
      blockinfile:
        path: /etc/ansible/facts.d/local.fact
        create: true
        block: |
          [localfacts]
          type: development
