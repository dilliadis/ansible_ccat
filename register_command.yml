---
- name: test register
  hosts: all
  gather_facts: false
  vars_prompt:
    - name: username
      prompt: which user are you looking for
      private: no
  tasks:
    - shell: cat /etc/passwd
      register: passwd_contents
    - debug:
       var: passwd_contents
    - debug:
       msg: echo "password contains user {{ username }}"
      when: passwd_contents.stdout.find(username) != -1
